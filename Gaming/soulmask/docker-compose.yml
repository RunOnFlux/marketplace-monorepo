services:
  soulmask:
    build:
      context: .
      dockerfile: Dockerfile
    image: soulmask-flux:local
    container_name: soulmask-server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "7777:7777/tcp"
      - "7777:7777/udp"
      - "27015:27015/udp"
      - "18888:18888/tcp"
      - "19000:19000/tcp"
    volumes:
      - ./soulmask-data:/data
      - ./soulmask-config:/config
